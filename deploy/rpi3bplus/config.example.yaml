transport: bluez
devices:
  - name: PRIZSALT Generator 1
    address: "AA:BB:CC:DD:EE:01"
    model: auto
    pin: "1234"
  - name: PRIZSALT Generator 2
    address: "AA:BB:CC:DD:EE:02"
    model: auto
    pin: "1234"

