name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"
          enable-cache: false
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python "$(which python)"
      - name: Verify locked runtime requirements export
        run: uv export --frozen --no-dev --no-emit-project --no-annotate --no-header | diff -u requirements.lock -
      - name: Compile
        run: uv run --frozen python -m compileall -q src
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Test
        run: uv run --frozen pytest -q
      - name: Verify self-contained Home Assistant app
        run: uv run --frozen python tools/sync_addon_bridge.py --check
      - name: Build and validate Home Assistant app archive
        run: uv run --frozen python tools/build_addon_zip.py "$RUNNER_TEMP/prizma-link-addon.zip"
